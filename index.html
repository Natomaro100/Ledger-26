<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Ledger 26</title>
<meta name="theme-color" content="#1F6F5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger 26">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<style>
  :root{
    --bg:#EEF2F0;
    --surface:#FFFFFF;
    --surface-2:#F5F8F6;
    --ink:#16211E;
    --ink-muted:#5C6B66;
    --ink-faint:#93A29C;
    --line:#DCE4E0;
    --accent:#1F6F5C;
    --accent-soft:#DCEEE8;
    --good:#2E7D5B;
    --good-soft:#DDEEE4;
    --warning:#A6690F;
    --warning-soft:#F6E7CE;
    --critical:#B33B33;
    --critical-soft:#F6DBD8;
    --shadow:0 1px 2px rgba(22,33,30,.04), 0 8px 24px -12px rgba(22,33,30,.18);
    --backdrop:rgba(12,18,16,.42);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1614;
      --surface:#16211E;
      --surface-2:#1B2724;
      --ink:#E8F0ED;
      --ink-muted:#93A69F;
      --ink-faint:#5E706A;
      --line:#25332F;
      --accent:#4FBE9E;
      --accent-soft:#1B322B;
      --good:#4FBE9E;
      --good-soft:#17322A;
      --warning:#E3A64A;
      --warning-soft:#2E2718;
      --critical:#E2635A;
      --critical-soft:#2E1D1B;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
      --backdrop:rgba(0,0,0,.55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1614;
    --surface:#16211E;
    --surface-2:#1B2724;
    --ink:#E8F0ED;
    --ink-muted:#93A69F;
    --ink-faint:#5E706A;
    --line:#25332F;
    --accent:#4FBE9E;
    --accent-soft:#1B322B;
    --good:#4FBE9E;
    --good-soft:#17322A;
    --warning:#E3A64A;
    --warning-soft:#2E2718;
    --critical:#E2635A;
    --critical-soft:#2E1D1B;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    --backdrop:rgba(0,0,0,.55);
    color-scheme: dark;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overscroll-behavior-y:none; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button, input, select{ font-family:inherit; }
  button{ transition:transform .12s ease, opacity .12s ease; }
  button:active{ transform:scale(.96); opacity:.85; }
  .mono{ font-family:ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric:tabular-nums; }
  .display{ font-family:ui-serif, Georgia, serif; font-style:italic; font-weight:500; }

  .app{ display:flex; flex-direction:column; height:100%; max-width:560px; margin:0 auto; position:relative; }

  .topbar{
    position:sticky; top:0; z-index:5;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 12px;
    background:var(--bg);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .month-nav{ display:flex; align-items:center; gap:10px; }
  .month-btn, .icon-btn{
    width:32px; height:32px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .icon-btn svg{ width:16px; height:16px; }
  .month-btn:focus-visible, .nav-btn:focus-visible, .icon-btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  .month-label{ font-size:19px; min-width:150px; text-align:center; }
  .topbar-right{ display:flex; align-items:center; gap:6px; }
  .today-btn{
    border:none; background:none; color:var(--accent); font-size:12px; font-weight:600;
    letter-spacing:.02em; cursor:pointer; padding:6px 4px;
  }

  .content{ flex:1; overflow-y:auto; padding:0 20px calc(96px + env(safe-area-inset-bottom,0px)); -webkit-overflow-scrolling:touch; }
  .content.fade-in{ animation:content-fade .2s ease; }
  @keyframes content-fade{ from{ opacity:.45; transform:translateY(4px); } to{ opacity:1; transform:translateY(0); } }

  .banner{
    background:var(--warning-soft); color:var(--warning); border-radius:14px;
    padding:10px 14px; font-size:12.5px; margin-bottom:14px; line-height:1.4;
  }
  .banner.err{ background:var(--critical-soft); color:var(--critical); }

  .hero{
    background:var(--surface); border-radius:22px; padding:22px 22px 20px;
    box-shadow:var(--shadow); margin-bottom:18px;
  }
  .hero-label{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-muted); font-weight:600; }
  .hero-amount{ font-size:42px; font-weight:600; line-height:1.15; margin-top:6px; transition:color .2s ease; }
  .hero-amount.warning{ color:var(--warning); }
  .hero-amount.critical{ color:var(--critical); }
  .hero-amount.small{ font-size:30px; }
  .hero-sub{ display:flex; gap:18px; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); flex-wrap:wrap; }
  .hero-stat{ display:flex; flex-direction:column; gap:2px; }
  .hero-stat span{ font-size:11px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.06em; }
  .hero-stat b{ font-size:14px; font-weight:600; }
  .hero-note{ font-size:12px; color:var(--ink-muted); margin-top:12px; line-height:1.4; }

  .section-title-row{ display:flex; align-items:center; justify-content:space-between; margin:4px 2px 10px; }
  .section-title{ font-size:13px; font-weight:600; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.06em; }
  .edit-link{ border:none; background:none; color:var(--accent); font-size:12px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:4px; padding:2px; }
  .edit-link svg{ width:13px; height:13px; }

  .cat-list{ display:flex; flex-direction:column; gap:10px; }
  .cat-card{ background:var(--surface); border-radius:16px; padding:14px 16px; box-shadow:var(--shadow); }
  .cat-row{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .cat-name{ font-size:14.5px; font-weight:600; }
  .cat-figures{ font-size:12.5px; color:var(--ink-muted); }
  .cat-bar{ height:7px; border-radius:99px; background:var(--line); margin-top:10px; overflow:hidden; }
  .cat-bar-fill{ height:100%; border-radius:99px; background:var(--good); transition:width .5s cubic-bezier(.2,.8,.2,1); }
  .cat-card[data-status="warning"] .cat-bar-fill{ background:var(--warning); }
  .cat-card[data-status="critical"] .cat-bar-fill{ background:var(--critical); }
  .cat-remaining{ margin-top:8px; font-size:12px; color:var(--good); font-weight:600; }
  .cat-card[data-status="warning"] .cat-remaining{ color:var(--warning); }
  .cat-card[data-status="critical"] .cat-remaining{ color:var(--critical); }
  .sub-meta{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:12px; color:var(--ink-muted); gap:10px; }
  .sub-meta-actions{ display:flex; gap:14px; flex-shrink:0; }

  .empty{ text-align:center; padding:40px 10px; color:var(--ink-muted); font-size:13.5px; }
  .hint{ text-align:center; padding:4px 10px 18px; color:var(--ink-faint); font-size:11.5px; }

  .add-card{ background:var(--surface); border-radius:20px; padding:20px; box-shadow:var(--shadow); margin-bottom:22px; }
  .add-title{ font-size:19px; margin-bottom:16px; }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .field label{ font-size:11.5px; font-weight:600; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.05em; }
  .field input, .field select{
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
    border-radius:12px; padding:13px 14px; font-size:16px; width:100%;
    transition:border-color .15s ease;
  }
  .field input:focus, .field select:focus{ border-color:var(--accent); outline:none; }
  .field input.mono{ font-size:16px; }
  .add-submit{
    width:100%; border:none; background:var(--accent); color:#fff; font-weight:600;
    font-size:15px; border-radius:14px; padding:15px; cursor:pointer; margin-top:6px;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .add-submit svg{ width:16px; height:16px; }

  .tx-list{ display:flex; flex-direction:column; gap:8px; }
  .tx-row{ position:relative; border-radius:14px; overflow:hidden; box-shadow:var(--shadow); }
  .tx-row-inner{
    background:var(--surface); padding:13px 14px; display:flex; align-items:center; gap:10px;
    position:relative; z-index:1; touch-action:pan-y; will-change:transform;
    transition:transform .25s cubic-bezier(.2,.8,.2,1);
  }
  .tx-row-inner.dragging{ transition:none; }
  .tx-main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .tx-line1{ display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; row-gap:2px; }
  .tx-date{ font-size:11.5px; color:var(--ink-faint); flex-shrink:0; }
  .tx-cat{ font-size:11.5px; font-weight:600; color:var(--accent); background:var(--accent-soft); padding:2px 8px; border-radius:99px; white-space:nowrap; }
  .tx-desc{ font-size:13.5px; color:var(--ink-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tx-amount{ font-size:15px; font-weight:600; flex-shrink:0; }
  .tx-swipe-delete{
    position:absolute; top:0; right:0; bottom:0; width:76px; z-index:0;
    border:none; background:var(--critical); color:#fff; font-size:12.5px; font-weight:600;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .tx-swipe-hint{ text-align:center; padding:2px 10px 4px; color:var(--ink-faint); font-size:11px; }

  .bottomnav{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    display:flex; justify-content:center;
  }
  .bottomnav-inner{
    display:flex; width:100%; max-width:560px; background:var(--surface); border-top:1px solid var(--line);
    padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));
  }
  .nav-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; padding:6px 4px; cursor:pointer; color:var(--ink-faint);
  }
  .nav-btn.active{ color:var(--accent); }
  .nav-btn span{ font-size:11px; font-weight:600; }
  .nav-btn svg{ width:22px; height:22px; }

  .overlay-backdrop{
    position:fixed; inset:0; background:var(--backdrop); z-index:30;
    display:flex; align-items:flex-end; justify-content:center;
    animation:backdrop-in .18s ease;
  }
  @keyframes backdrop-in{ from{ opacity:0; } to{ opacity:1; } }
  .overlay-sheet{
    width:100%; max-width:560px; max-height:88%; overflow-y:auto;
    background:var(--surface); border-radius:22px 22px 0 0; box-shadow:var(--shadow);
    padding:20px 20px calc(18px + env(safe-area-inset-bottom,0px));
    animation:sheet-up .22s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes sheet-up{ from{ transform:translateY(28px); opacity:.5; } to{ transform:translateY(0); opacity:1; } }
  .overlay-title{ font-size:21px; margin-bottom:4px; }
  .overlay-hint{ font-size:12.5px; color:var(--ink-muted); margin-bottom:16px; line-height:1.4; }
  .edit-row{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .edit-row .field{ margin-bottom:0; }
  .edit-row .field.name{ flex:1.4; }
  .edit-row .field.amt{ flex:1; }
  .row-del{ border:none; background:var(--surface-2); color:var(--ink-faint); width:34px; height:34px; border-radius:10px; font-size:17px; cursor:pointer; flex-shrink:0; margin-top:18px; }
  .add-row-btn{
    border:1px dashed var(--line); background:none; color:var(--ink-muted); width:100%;
    border-radius:10px; padding:10px; font-size:13px; font-weight:600; cursor:pointer; margin:6px 0 18px;
  }
  .overlay-actions{ display:flex; gap:10px; }
  .overlay-actions button{ flex:1; border:none; border-radius:12px; padding:13px; font-size:14.5px; font-weight:600; cursor:pointer; }
  .overlay-actions .cancel{ background:var(--surface-2); color:var(--ink-muted); }
  .overlay-actions .save{ background:var(--accent); color:#fff; }
  .overlay-actions.tight{ margin-bottom:14px; }
  .delete-sub-link{ border:none; background:none; color:var(--critical); font-size:13px; font-weight:600; cursor:pointer; padding:6px 2px; width:100%; text-align:center; }
  .tx-confirm{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .tx-confirm button{ border:none; border-radius:8px; padding:7px 10px; font-size:12px; font-weight:600; cursor:pointer; }
  .tx-confirm .cancel{ background:var(--surface-2); color:var(--ink-muted); }
  .tx-confirm .confirm{ background:var(--critical); color:#fff; }

  @media (max-width:380px){
    .hero-amount{ font-size:36px; }
    .hero-amount.small{ font-size:26px; }
    .field-row{ flex-direction:column; gap:0; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="month-nav">
      <button class="month-btn" data-action="prev-month" aria-label="Previous month">‹</button>
      <div class="month-label display" id="month-label"></div>
      <button class="month-btn" data-action="next-month" aria-label="Next month">›</button>
    </div>
    <div class="topbar-right">
      <button class="today-btn" data-action="today">Today</button>
      <button class="icon-btn" data-action="open-edit" aria-label="Edit budget">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l11-11-4-4L4 16v4Z"/></svg>
      </button>
    </div>
  </div>
  <div class="content" id="content"></div>
  <div class="bottomnav">
    <div class="bottomnav-inner">
      <button class="nav-btn" data-tab="overview" data-action="set-tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.2"/><path d="M12 3.8A8.2 8.2 0 0 1 20.2 12H12Z" fill="currentColor" stroke="none"/></svg>
        <span>Overview</span>
      </button>
      <button class="nav-btn" data-tab="log" data-action="set-tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3.5" width="16" height="17" rx="2.2"/><path d="M8 8.5h8M8 12h8M8 15.5h5"/></svg>
        <span>Log</span>
      </button>
      <button class="nav-btn" data-tab="subs" data-action="set-tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a8 8 0 0 0-14.9-4.2M4 12.5a8 8 0 0 0 14.9 4.2"/><path d="M4.2 3.5v4.5h4.5M19.8 20.5V16h-4.5"/></svg>
        <span>Subs</span>
      </button>
    </div>
  </div>
  <div id="overlay-root"></div>
  <div id="sub-overlay-root"></div>
</div>

<script>
(function(){
  "use strict";

  var STORE_KEY = "ledger26_store_v1";

  var DEFAULT_STORE = {
    config: {
      income: 4600.00,
      categories: [
        { id:"subscriptions", name:"Subscriptions", budgeted:386.00 },
        { id:"debt-payment", name:"Debt Payment", budgeted:627.63 },
        { id:"groceries", name:"Groceries", budgeted:800.00 },
        { id:"entertainment", name:"Entertainment", budgeted:300.00 },
        { id:"eating-out", name:"Eating Out", budgeted:600.00 },
        { id:"pets", name:"Pets", budgeted:150.00 },
        { id:"shopping", name:"Shopping", budgeted:300.00 },
        { id:"gas-parking", name:"Gas/Parking", budgeted:120.00 },
        { id:"misc", name:"MISC", budgeted:816.00 },
        { id:"savings", name:"Savings", budgeted:500.00 }
      ]
    },
    transactions: [],
    subscriptions: []
  };

  var state = {
    tab: "overview",
    month: null,       // {y,m}
    store: null,       // { config:{income,categories}, transactions:[], subscriptions:[] }
    error: null,
    editDraft: null,    // {income, categories:[{id,name,budgeted}]} while the edit-budget sheet is open
    subEditDraft: null, // {id, name, amount, day, active} while the subscription sheet is open
    subDeleteConfirm: false,
    openSwipeId: null   // id of the transaction row currently revealed by a swipe
  };

  // ---------- local storage ----------

  function loadStore(){
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STORE));
      var parsed = JSON.parse(raw);
      if (!parsed || !parsed.config || !Array.isArray(parsed.config.categories)){
        return JSON.parse(JSON.stringify(DEFAULT_STORE));
      }
      parsed.transactions = Array.isArray(parsed.transactions) ? parsed.transactions : [];
      parsed.subscriptions = Array.isArray(parsed.subscriptions) ? parsed.subscriptions : [];
      return parsed;
    } catch(e){
      return JSON.parse(JSON.stringify(DEFAULT_STORE));
    }
  }

  function saveStore(){
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state.store));
    } catch(e){
      state.error = "Couldn't save — your device storage might be full.";
    }
  }

  // ---------- helpers ----------

  function pad(n){ return String(n).padStart(2,"0"); }
  function monthKey(y,m){ return y + "-" + pad(m+1); }
  function monthLabel(y,m){ return new Date(y, m, 1).toLocaleDateString("en-US", { month:"long", year:"numeric" }); }
  function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function shortDate(iso){
    var parts = iso.split("-").map(Number);
    return new Date(parts[0], parts[1]-1, parts[2]).toLocaleDateString("en-US", { month:"short", day:"numeric" });
  }
  function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
  function ordinal(n){
    n = Number(n) || 0;
    var s = ["th","st","nd","rd"], v = n % 100;
    return n + (s[(v-20)%10] || s[v] || s[0]);
  }
  function fmt(n){
    n = Number(n) || 0;
    var sign = n < 0 ? "-" : "";
    return sign + "$" + Math.abs(n).toLocaleString("en-US", { minimumFractionDigits:2, maximumFractionDigits:2 });
  }
  function statusFor(spent, budgeted){
    if (!budgeted || budgeted <= 0) return "good";
    var ratio = spent / budgeted;
    if (ratio > 1) return "critical";
    if (ratio >= 0.8) return "warning";
    return "good";
  }
  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function slugify(name){
    var s = String(name).toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-+|-+$)/g, "");
    return s || "category";
  }
  function uniqueId(base, existingIds){
    var id = base, n = 2;
    while (existingIds.indexOf(id) !== -1){ id = base + "-" + n; n++; }
    return id;
  }

  function activeCategories(){ return state.store.config.categories; }
  function activeIncome(){ return state.store.config.income; }
  function categoryById(id){
    var cats = activeCategories();
    for (var i=0;i<cats.length;i++){ if (cats[i].id === id) return cats[i]; }
    return null;
  }
  function subscriptionsTotal(){
    return state.store.subscriptions.filter(function(s){ return s.active !== false; })
      .reduce(function(sum, s){ return sum + (Number(s.amount) || 0); }, 0);
  }
  function budgetedFor(c){
    return c.id === "subscriptions" ? subscriptionsTotal() : c.budgeted;
  }

  function txsForMonth(){
    var key = monthKey(state.month.y, state.month.m);
    return state.store.transactions.filter(function(t){ return t.date && t.date.slice(0,7) === key; });
  }

  function spentByCategory(){
    var map = {};
    txsForMonth().forEach(function(t){
      var key = t.categoryId || t.category;
      map[key] = (map[key] || 0) + (Number(t.amount) || 0);
    });
    return map;
  }

  // ---------- rendering: main content ----------

  function render(){
    document.getElementById("month-label").textContent = monthLabel(state.month.y, state.month.m);
    document.querySelectorAll(".nav-btn").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-tab") === state.tab);
    });
    var el = document.getElementById("content");
    el.innerHTML = (state.tab === "overview") ? renderOverview() : (state.tab === "log") ? renderLog() : renderSubs();
    el.classList.remove("fade-in");
    void el.offsetWidth; // restart the fade animation on every render
    el.classList.add("fade-in");
  }

  function renderBanner(){
    if (state.error){
      return '<div class="banner err">' + escapeHtml(state.error) + "</div>";
    }
    return "";
  }

  function renderOverview(){
    var spent = spentByCategory();
    var cats = activeCategories();
    var income = activeIncome();
    var totalSpent = 0;
    cats.forEach(function(c){ totalSpent += spent[c.id] || spent[c.name] || 0; });
    var remaining = income - totalSpent;
    var totalBudgeted = cats.reduce(function(s,c){ return s + budgetedFor(c); }, 0);
    var heroStatus = statusFor(totalSpent, income);

    var html = renderBanner();
    html += '<div class="hero">' +
      '<div class="hero-label">Remaining in ' + escapeHtml(new Date(state.month.y, state.month.m, 1).toLocaleDateString("en-US",{month:"long"})) + '</div>' +
      '<div class="hero-amount mono ' + (heroStatus !== "good" ? heroStatus : "") + '">' + fmt(remaining) + '</div>' +
      '<div class="hero-sub">' +
        '<div class="hero-stat"><span>Income</span><b class="mono">' + fmt(income) + '</b></div>' +
        '<div class="hero-stat"><span>Budgeted</span><b class="mono">' + fmt(totalBudgeted) + '</b></div>' +
        '<div class="hero-stat"><span>Spent</span><b class="mono">' + fmt(totalSpent) + '</b></div>' +
      '</div>' +
    '</div>';

    html += '<div class="section-title-row"><div class="section-title">Categories</div>' +
      '<button class="edit-link" data-action="open-edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l11-11-4-4L4 16v4Z"/></svg>Edit</button></div>';
    html += '<div class="cat-list">';
    cats.forEach(function(c){
      var s = spent[c.id] || spent[c.name] || 0;
      var budgeted = budgetedFor(c);
      var status = statusFor(s, budgeted);
      var pct = budgeted > 0 ? Math.min(100, (s / budgeted) * 100) : 0;
      var left = budgeted - s;
      html += '<div class="cat-card" data-status="' + status + '">' +
        '<div class="cat-row">' +
          '<span class="cat-name">' + escapeHtml(c.name) + '</span>' +
          '<span class="cat-figures mono">' + fmt(s) + ' / ' + fmt(budgeted) + '</span>' +
        '</div>' +
        '<div class="cat-bar"><div class="cat-bar-fill" style="width:' + pct.toFixed(1) + '%"></div></div>' +
        '<div class="cat-remaining">' + (left < 0 ? (fmt(Math.abs(left)) + ' over') : (fmt(left) + ' left')) + '</div>' +
      '</div>';
    });
    html += '</div>';
    return html;
  }

  function renderLog(){
    var cats = activeCategories();
    var options = cats.map(function(c){ return '<option value="' + escapeHtml(c.id) + '">' + escapeHtml(c.name) + '</option>'; }).join("");

    var html = renderBanner();
    html += '<div class="add-card">' +
      '<div class="add-title display">Log a transaction</div>' +
      '<form id="add-form">' +
        '<div class="field-row">' +
          '<div class="field"><label for="f-date">Date</label><input class="mono" type="date" id="f-date" value="' + todayISO() + '" required></div>' +
          '<div class="field"><label for="f-amount">Amount</label><input class="mono" type="number" step="0.01" min="0" placeholder="0.00" inputmode="decimal" id="f-amount" required></div>' +
        '</div>' +
        '<div class="field"><label for="f-category">Category</label><select id="f-category">' + options + '</select></div>' +
        '<div class="field"><label for="f-desc">Description</label><input type="text" id="f-desc" placeholder="Optional — e.g. Trader Joe’s"></div>' +
        '<button class="add-submit" type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add transaction</button>' +
      '</form>' +
    '</div>';

    html += '<div class="section-title">' + escapeHtml(monthLabel(state.month.y, state.month.m)) + '</div>';

    var list = txsForMonth().slice().sort(function(a,b){
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });

    if (list.length === 0){
      html += '<div class="empty">No transactions logged yet this month.</div>';
    } else {
      html += '<div class="tx-list">';
      list.forEach(function(t){
        var open = state.openSwipeId === t.id;
        html += '<div class="tx-row" data-id="' + t.id + '">' +
          '<button class="tx-swipe-delete" data-action="swipe-delete" data-id="' + t.id + '" type="button">Delete</button>' +
          '<div class="tx-row-inner" data-id="' + t.id + '" style="transform:translateX(' + (open ? "-76px" : "0") + ')">' +
            '<div class="tx-main">' +
              '<div class="tx-line1"><span class="tx-date mono">' + shortDate(t.date) + '</span><span class="tx-cat">' + escapeHtml(t.category) + '</span></div>' +
              (t.description ? '<span class="tx-desc">' + escapeHtml(t.description) + '</span>' : '') +
            '</div>' +
            '<span class="tx-amount mono">' + fmt(t.amount) + '</span>' +
          '</div>' +
        '</div>';
      });
      html += '</div>';
      html += '<div class="tx-swipe-hint">Swipe a transaction left to delete it</div>';
    }
    return html;
  }

  function renderSubs(){
    var total = subscriptionsTotal();
    var html = renderBanner();
    html += '<div class="hero">' +
      '<div class="hero-label">Monthly subscriptions</div>' +
      '<div class="hero-amount mono small">' + fmt(total) + '</div>' +
      '<div class="hero-note">This total is your Subscriptions budget on the Overview tab. Each active subscription below posts itself as a transaction on its billing day — you don’t need to log it by hand.</div>' +
    '</div>';

    html += '<button class="add-row-btn" data-action="open-add-sub" type="button">+ Add subscription</button>';

    if (!state.store.subscriptions.length){
      html += '<div class="empty">No subscriptions yet. Add one above.</div>';
    } else {
      var sorted = state.store.subscriptions.slice().sort(function(a,b){ return (a.day||0) - (b.day||0); });
      html += '<div class="cat-list">';
      sorted.forEach(function(s){
        var paused = s.active === false;
        html += '<div class="cat-card"' + (paused ? ' style="opacity:.55;"' : '') + '>' +
          '<div class="cat-row">' +
            '<span class="cat-name">' + escapeHtml(s.name) + '</span>' +
            '<span class="cat-figures mono">' + fmt(s.amount) + '</span>' +
          '</div>' +
          '<div class="sub-meta">' +
            '<span>' + (paused ? "Paused" : ("Bills on the " + ordinal(s.day))) + '</span>' +
            '<span class="sub-meta-actions">' +
              '<button class="edit-link" data-action="toggle-sub-active" data-id="' + s.id + '" type="button">' + (paused ? "Resume" : "Pause") + '</button>' +
              '<button class="edit-link" data-action="open-edit-sub" data-id="' + s.id + '" type="button">Edit</button>' +
            '</span>' +
          '</div>' +
        '</div>';
      });
      html += '</div>';
    }
    return html;
  }

  // ---------- rendering: edit-budget overlay ----------

  function renderOverlay(){
    var root = document.getElementById("overlay-root");
    if (!state.editDraft){ root.innerHTML = ""; return; }
    var d = state.editDraft;
    var rows = d.categories.map(function(c, i){
      var isSubs = c.id === "subscriptions";
      var amtValue = isSubs ? subscriptionsTotal().toFixed(2) : Number(c.budgeted).toFixed(2);
      return '<div class="edit-row">' +
        '<div class="field name"><label>Category</label><input type="text" id="edit-name-' + i + '" value="' + escapeHtml(c.name) + '" placeholder="Category name"></div>' +
        '<div class="field amt"><label>Budgeted' + (isSubs ? ' (auto)' : '') + '</label><input class="mono" type="number" step="0.01" min="0" id="edit-amt-' + i + '" value="' + amtValue + '"' + (isSubs ? ' disabled title="Managed from the Subs tab"' : '') + '></div>' +
        (isSubs ? '<div class="row-del" style="visibility:hidden;"></div>' : '<button class="row-del" data-action="remove-category-row" data-idx="' + i + '" aria-label="Remove category">×</button>') +
      '</div>';
    }).join("");

    root.innerHTML =
      '<div class="overlay-backdrop" data-action="backdrop-close">' +
        '<div class="overlay-sheet" data-stop-close>' +
          '<div class="overlay-title display">Edit budget</div>' +
          '<div class="overlay-hint">Renaming a category won’t change past transactions — they keep the name you logged them under. Subscriptions is managed from the Subs tab.</div>' +
          '<div class="field"><label for="edit-income">Monthly income</label><input class="mono" type="number" step="0.01" min="0" id="edit-income" value="' + Number(d.income).toFixed(2) + '"></div>' +
          rows +
          '<button class="add-row-btn" data-action="add-category-row" type="button">+ Add category</button>' +
          '<div class="overlay-actions">' +
            '<button class="cancel" data-action="close-edit" type="button">Cancel</button>' +
            '<button class="save" data-action="save-edit" type="button">Save</button>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function syncEditDraftFromDom(){
    if (!state.editDraft) return;
    var incomeEl = document.getElementById("edit-income");
    if (incomeEl) state.editDraft.income = incomeEl.value;
    state.editDraft.categories.forEach(function(c, i){
      var nameEl = document.getElementById("edit-name-" + i);
      var amtEl = document.getElementById("edit-amt-" + i);
      if (nameEl) c.name = nameEl.value;
      if (amtEl && c.id !== "subscriptions") c.budgeted = amtEl.value;
    });
  }

  function openEdit(){
    var cats = activeCategories();
    state.editDraft = {
      income: activeIncome(),
      categories: cats.map(function(c){ return { id:c.id, name:c.name, budgeted:c.budgeted }; })
    };
    renderOverlay();
  }

  function closeEdit(){
    state.editDraft = null;
    renderOverlay();
  }

  function addCategoryRow(){
    syncEditDraftFromDom();
    state.editDraft.categories.push({ id:null, name:"", budgeted:0 });
    renderOverlay();
  }

  function removeCategoryRow(idx){
    syncEditDraftFromDom();
    state.editDraft.categories.splice(idx, 1);
    renderOverlay();
  }

  function saveEdit(){
    syncEditDraftFromDom();
    var income = parseFloat(state.editDraft.income);
    if (isNaN(income) || income < 0){ state.error = "Enter a valid monthly income."; render(); return; }

    var existingIds = [];
    var categories = [];
    state.editDraft.categories.forEach(function(c){
      var name = String(c.name || "").trim();
      if (!name) return;
      var budgeted = parseFloat(c.budgeted);
      if (isNaN(budgeted) || budgeted < 0) budgeted = 0;
      var id = c.id || uniqueId(slugify(name), existingIds);
      existingIds.push(id);
      categories.push({ id:id, name:name, budgeted:budgeted });
    });
    if (categories.length === 0){ state.error = "Add at least one category."; render(); return; }

    // the Subscriptions category is always derived from the Subs tab, never hand-edited
    categories = categories.map(function(c){
      return c.id === "subscriptions" ? { id:c.id, name:c.name, budgeted:subscriptionsTotal() } : c;
    });

    state.store.config = { income: income, categories: categories };
    saveStore();
    state.error = null;
    state.editDraft = null;
    renderOverlay();
    render();
  }

  // ---------- rendering: subscription overlay ----------

  function renderSubOverlay(){
    var root = document.getElementById("sub-overlay-root");
    if (!state.subEditDraft){ root.innerHTML = ""; return; }
    var d = state.subEditDraft;
    var isNew = !d.id;

    var deleteBlock = "";
    if (!isNew){
      deleteBlock = state.subDeleteConfirm
        ? '<div class="tx-confirm" style="justify-content:center;width:100%;margin-top:4px;"><button class="cancel" data-action="cancel-delete-sub" type="button">Cancel</button><button class="confirm" data-action="confirm-delete-sub" type="button">Delete subscription</button></div>'
        : '<button class="delete-sub-link" data-action="ask-delete-sub" type="button">Delete subscription</button>';
    }

    root.innerHTML =
      '<div class="overlay-backdrop" data-action="sub-backdrop-close">' +
        '<div class="overlay-sheet" data-stop-close>' +
          '<div class="overlay-title display">' + (isNew ? "Add subscription" : "Edit subscription") + '</div>' +
          '<div class="overlay-hint">It’ll post automatically to your Subscriptions budget on this day every month.</div>' +
          '<div class="field"><label for="sub-name">Name</label><input type="text" id="sub-name" value="' + escapeHtml(d.name) + '" placeholder="e.g. Netflix"></div>' +
          '<div class="field-row">' +
            '<div class="field"><label for="sub-amount">Amount</label><input class="mono" type="number" step="0.01" min="0" id="sub-amount" value="' + (d.amount === "" ? "" : Number(d.amount).toFixed(2)) + '" placeholder="0.00"></div>' +
            '<div class="field"><label for="sub-day">Billing day</label><input class="mono" type="number" min="1" max="31" id="sub-day" value="' + (d.day || "") + '" placeholder="1–31"></div>' +
          '</div>' +
          '<div class="overlay-actions tight">' +
            '<button class="cancel" data-action="close-sub-overlay" type="button">Cancel</button>' +
            '<button class="save" data-action="save-sub" type="button">Save</button>' +
          '</div>' +
          deleteBlock +
        '</div>' +
      '</div>';
  }

  function openAddSub(){
    state.subEditDraft = { id:null, name:"", amount:"", day:"", active:true };
    state.subDeleteConfirm = false;
    renderSubOverlay();
  }

  function openEditSub(id){
    var s = state.store.subscriptions.find(function(x){ return x.id === id; });
    if (!s) return;
    state.subEditDraft = { id:s.id, name:s.name, amount:s.amount, day:s.day, active:s.active !== false };
    state.subDeleteConfirm = false;
    renderSubOverlay();
  }

  function closeSubOverlay(){
    state.subEditDraft = null;
    state.subDeleteConfirm = false;
    renderSubOverlay();
  }

  function saveSubscription(){
    var nameEl = document.getElementById("sub-name");
    var amountEl = document.getElementById("sub-amount");
    var dayEl = document.getElementById("sub-day");
    var name = nameEl.value.trim();
    var amount = parseFloat(amountEl.value);
    var day = parseInt(dayEl.value, 10);
    if (!name || isNaN(amount) || amount < 0 || isNaN(day) || day < 1 || day > 31){
      state.error = "Enter a name, an amount, and a billing day between 1 and 31.";
      render();
      return;
    }
    var draft = state.subEditDraft;
    var payload = { name:name, amount:amount, day:day, active: draft.active !== false };

    if (draft.id){
      state.store.subscriptions = state.store.subscriptions.map(function(s){
        return s.id === draft.id ? Object.assign({}, s, payload) : s;
      });
    } else {
      state.store.subscriptions.push(Object.assign({ id:"sub-" + Date.now() + "-" + Math.random().toString(36).slice(2,6), lastPostedMonth:null }, payload));
    }
    saveStore();
    runAutopostCheck();
    state.error = null;
    state.subEditDraft = null;
    renderSubOverlay();
    render();
  }

  function toggleSubActive(id){
    var sub = state.store.subscriptions.find(function(s){ return s.id === id; });
    if (!sub) return;
    sub.active = sub.active === false;
    saveStore();
    runAutopostCheck();
    render();
  }

  function deleteSubscription(id){
    state.store.subscriptions = state.store.subscriptions.filter(function(s){ return s.id !== id; });
    saveStore();
    state.subEditDraft = null;
    state.subDeleteConfirm = false;
    renderSubOverlay();
    render();
  }

  // ---------- autopost ----------

  function runAutopostCheck(){
    var subs = state.store.subscriptions;
    if (!subs || !subs.length) return;
    var now = new Date();
    var y = now.getFullYear(), m = now.getMonth(), day = now.getDate();
    var mKey = monthKey(y, m);
    var posted = false;
    subs.forEach(function(s){
      if (s.active === false) return;
      if (s.lastPostedMonth === mKey) return;
      if (day < (s.day || 1)) return;
      var postDay = Math.min(s.day || 1, daysInMonth(y, m));
      var dateStr = y + "-" + pad(m + 1) + "-" + pad(postDay);
      state.store.transactions.unshift({
        id: "tx-auto-" + s.id + "-" + mKey,
        date: dateStr, category: "Subscriptions", categoryId: "subscriptions",
        amount: s.amount, description: s.name + " (auto)", createdAt: Date.now()
      });
      s.lastPostedMonth = mKey;
      posted = true;
    });
    if (posted) saveStore();
  }

  // ---------- transactions ----------

  function addTransaction(payload){
    var id = "tx-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    state.store.transactions.unshift({
      id: id, date: payload.date, category: payload.category, categoryId: payload.categoryId,
      amount: payload.amount, description: payload.description, createdAt: Date.now()
    });
    saveStore();
    render();
  }

  function deleteTransaction(id){
    state.store.transactions = state.store.transactions.filter(function(t){ return t.id !== id; });
    if (state.openSwipeId === id) state.openSwipeId = null;
    saveStore();
    render();
  }

  // ---------- swipe-to-delete ----------

  var swipe = null; // { id, startX, startY, el, decided, axis, wasOpen, dx }

  function attachSwipeHandlers(){
    var content = document.getElementById("content");

    content.addEventListener("pointerdown", function(e){
      var inner = e.target.closest(".tx-row-inner");
      if (!inner) return;
      swipe = {
        id: inner.getAttribute("data-id"),
        startX: e.clientX, startY: e.clientY,
        el: inner, pointerId: e.pointerId,
        decided: false, axis: null, dx: 0,
        wasOpen: state.openSwipeId === inner.getAttribute("data-id")
      };
      inner.classList.add("dragging");
    });

    content.addEventListener("pointermove", function(e){
      if (!swipe || swipe.pointerId !== e.pointerId) return;
      var dx = e.clientX - swipe.startX;
      var dy = e.clientY - swipe.startY;
      if (!swipe.decided){
        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        swipe.decided = true;
        swipe.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
        if (swipe.axis === "x"){
          try { swipe.el.setPointerCapture(e.pointerId); } catch(err){}
        }
      }
      if (swipe.axis !== "x") return;
      e.preventDefault();
      var base = swipe.wasOpen ? -76 : 0;
      var t = Math.max(-96, Math.min(0, base + dx));
      swipe.dx = t;
      swipe.el.style.transform = "translateX(" + t + "px)";
    });

    function endSwipe(e){
      if (!swipe || swipe.pointerId !== e.pointerId) return;
      var s = swipe;
      s.el.classList.remove("dragging");
      if (s.axis === "x"){
        var shouldOpen = s.dx < -38;
        state.openSwipeId = shouldOpen ? s.id : null;
        s.el.style.transform = shouldOpen ? "translateX(-76px)" : "translateX(0)";
      }
      swipe = null;
    }
    content.addEventListener("pointerup", endSwipe);
    content.addEventListener("pointercancel", endSwipe);
  }

  // ---------- events ----------

  document.addEventListener("click", function(e){
    if (state.openSwipeId){
      var withinOpenRow = e.target.closest('.tx-row[data-id="' + state.openSwipeId + '"]');
      if (!withinOpenRow){
        state.openSwipeId = null;
        render();
        return;
      }
    }

    if (e.target && e.target.hasAttribute && e.target.hasAttribute("data-action")){
      var directAction = e.target.getAttribute("data-action");
      if (directAction === "backdrop-close"){ closeEdit(); return; }
      if (directAction === "sub-backdrop-close"){ closeSubOverlay(); return; }
    }
    var actionEl = e.target.closest("[data-action]");
    if (!actionEl) return;
    var action = actionEl.getAttribute("data-action");
    if (action === "prev-month"){
      var m = state.month.m - 1, y = state.month.y;
      if (m < 0){ m = 11; y -= 1; }
      state.month = { y:y, m:m };
      render();
    } else if (action === "next-month"){
      var m2 = state.month.m + 1, y2 = state.month.y;
      if (m2 > 11){ m2 = 0; y2 += 1; }
      state.month = { y:y2, m:m2 };
      render();
    } else if (action === "today"){
      var d = new Date();
      state.month = { y: d.getFullYear(), m: d.getMonth() };
      render();
    } else if (action === "set-tab"){
      state.tab = actionEl.getAttribute("data-tab");
      state.error = null;
      state.openSwipeId = null;
      render();
    } else if (action === "swipe-delete"){
      deleteTransaction(actionEl.getAttribute("data-id"));
    } else if (action === "open-edit"){
      state.error = null;
      openEdit();
    } else if (action === "close-edit"){
      closeEdit();
    } else if (action === "add-category-row"){
      addCategoryRow();
    } else if (action === "remove-category-row"){
      removeCategoryRow(parseInt(actionEl.getAttribute("data-idx"), 10));
    } else if (action === "save-edit"){
      saveEdit();
    } else if (action === "open-add-sub"){
      state.error = null;
      openAddSub();
    } else if (action === "open-edit-sub"){
      state.error = null;
      openEditSub(actionEl.getAttribute("data-id"));
    } else if (action === "close-sub-overlay"){
      closeSubOverlay();
    } else if (action === "toggle-sub-active"){
      toggleSubActive(actionEl.getAttribute("data-id"));
    } else if (action === "ask-delete-sub"){
      state.subDeleteConfirm = true;
      renderSubOverlay();
    } else if (action === "cancel-delete-sub"){
      state.subDeleteConfirm = false;
      renderSubOverlay();
    } else if (action === "confirm-delete-sub"){
      deleteSubscription(state.subEditDraft.id);
    } else if (action === "save-sub"){
      saveSubscription();
    }
  });

  document.addEventListener("submit", function(e){
    if (e.target && e.target.id === "add-form"){
      e.preventDefault();
      var dateEl = document.getElementById("f-date");
      var amountEl = document.getElementById("f-amount");
      var catEl = document.getElementById("f-category");
      var descEl = document.getElementById("f-desc");
      var amount = parseFloat(amountEl.value);
      if (!dateEl.value || isNaN(amount) || amount < 0) return;
      var cat = categoryById(catEl.value);
      addTransaction({
        date: dateEl.value,
        categoryId: catEl.value,
        category: cat ? cat.name : catEl.value,
        amount: amount,
        description: descEl.value.trim()
      });
      amountEl.value = "";
      descEl.value = "";
    }
  });

  // ---------- boot ----------

  function init(){
    var d = new Date();
    state.month = { y: d.getFullYear(), m: d.getMonth() };
    state.store = loadStore();
    runAutopostCheck();
    render();
    attachSwipeHandlers();

    document.addEventListener("visibilitychange", function(){
      if (!document.hidden){
        runAutopostCheck();
        render();
      }
    });
    setInterval(function(){ runAutopostCheck(); render(); }, 60 * 60 * 1000);
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();

if ("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
